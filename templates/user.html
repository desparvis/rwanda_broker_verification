<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RWAREB License Verification</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
</head>
<body>
  <header class="header-container">
    <h1>Rwanda Real Estate Advisory Council</h1>
    <a href="/admin" class="nav-link">Access Admin Console</a>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-header">
        <h2>Broker Verification System</h2>
        <p>Query the public blockchain registry to verify real estate credentials.</p>
      </div>
      
      <div class="card-body">
        <div class="form-group">
          <label>Broker Ethereum Address</label>
          <input type="text" id="agentAddressInput" placeholder="0x..." autocomplete="off" spellcheck="false" />
        </div>
        <div id="verifyResult" class="result-box hidden"></div>
      </div>

      <div class="btn-group">
        <button id="verifyBtn" class="btn btn-primary">Query Blockchain</button>
      </div>
    </section>
  </main>

  <!-- Applish Modal Component -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Notice</h3>
      </div>
      <div class="modal-body" id="modalMessage"></div>
      <div class="modal-footer">
        <button class="modal-btn" id="modalCloseBtn">OK</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
